name: gitexplorer
description: A folder explorer over git repositories, built on git_dart.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  file_picker: ^12.0.0
  git_dart:
    path: ../../packages/git_dart
  ffi: ^2.1.0
  path: ^1.9.0
  path_provider: ^2.1.4
  syntax_dart:
    path: ../../packages/syntax_dart
  unimsg_view:
    path: ../../packages/unimsg_view
dev_dependencies:
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^4.0.0
  flutter_test:
    sdk: flutter
  # Used only by tool/generate_tokens.dart, which reads explorer.umsg.
  unimsg:
    path: ../../packages/unimsg

flutter:
  uses-material-design: true
  assets:
    # Linux has no launcher-icon convention of its own; the runner loads this
    # one out of the bundle and hands it to GTK.
    - assets/icon/app_icon_rounded.png

# All launcher assets are built from the source mark by tool/generate_icon.py.
flutter_launcher_icons:
  image_path: assets/icon/app_icon.png
  android: true
  adaptive_icon_background: "#1A2130"
  adaptive_icon_foreground: assets/icon/app_icon_foreground.png
  ios: true
  remove_alpha_ios: true
  macos:
    generate: true
    image_path: assets/icon/app_icon_macos.png
  # Windows and Linux are handled directly by tool/generate_icon.py.
  windows:
    generate: false
