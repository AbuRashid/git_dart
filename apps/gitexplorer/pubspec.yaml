name: gitexplorer
description: A folder explorer over git repositories, built on git_dart.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  file_picker: ^8.1.2
  git_dart:
    path: ../../packages/git_dart
  path: ^1.9.0
  path_provider: ^2.1.4

dev_dependencies:
  flutter_lints: ^4.0.0
  flutter_test:
    sdk: flutter
  # Used only by tool/generate_tokens.dart, which reads explorer.umsg.
  unimsg:
    path: ../../packages/unimsg

flutter:
  uses-material-design: true
