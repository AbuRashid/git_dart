name: git_dart
description: >-
  A pure Dart implementation of the git object system, storage, refs and index,
  derived from systems/git/v0 (git.umsg).
version: 0.1.0
publish_to: none

environment:
  # 3.5 for extension types, which the OPFS interop is written with. The app
  # already required this much.
  sdk: ^3.5.0

dependencies:
  # A pure-Dart inflate that reports how much input it consumed. dart:io's
  # zlib does not, and a packfile does not record where a compressed object
  # ends — so without this there is no way to find the next one.
  archive: ^3.6.1
  crypto: ^3.0.3
  path: ^1.9.0

dev_dependencies:
  lints: ^4.0.0
  test: ^1.25.0
