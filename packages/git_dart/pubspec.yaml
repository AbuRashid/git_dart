name: git_dart
description: >-
  Git in pure Dart: objects and packs, refs, the index and working tree, merge,
  rebase and stash, and clone, fetch and push. No git binary, no FFI.
version: 0.2.0
repository: https://github.com/AbuRashid/git_dart/tree/main/packages/git_dart
issue_tracker: https://github.com/AbuRashid/git_dart/issues

environment:
  # 3.5 for extension types, which the OPFS interop is written with. The app
  # already required this much.
  sdk: ^3.5.0

dependencies:
  # A pure-Dart inflate that reports how much input it consumed. dart:io's
  # zlib does not, and a packfile does not record where a compressed object
  # ends — so without this there is no way to find the next one.
  archive: ^3.6.1
  crypto: ^3.0.3
  path: ^1.9.0

dev_dependencies:
  lints: ^4.0.0
  test: ^1.25.0
